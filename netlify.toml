[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"

# ==============================================================================
# Netlify API Proxy to Render Backend (Free Tier)
# ------------------------------------------------------------------------------
# Proxies ALL frontend /api/* requests to your Render Free Tier backend service.
# NOTE: If your Render URL is different from 'simple-e-commerce-app.onrender.com',
# update the URL target below.
# ==============================================================================

[[redirects]]
  from = "/api/*"
  to = "https://simple-e-commerce-app.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Single Page App Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
