server:
  port: 8082
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:h2:file:./data/userdb;AUTO_SERVER=TRUE
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
app:
  jwt-secret: change-this-demo-secret-to-a-long-random-value-at-least-32-bytes
