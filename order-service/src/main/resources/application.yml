server:
  port: 8085
spring:
  datasource:
    url: jdbc:h2:file:./data/orderdb;AUTO_SERVER=TRUE
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
app:
  jwt-secret: change-this-demo-secret-to-a-long-random-value-at-least-32-bytes
  internal-api-key: local-order-service-key-change-in-production
  cart-service-url: http://localhost:8084
  product-service-url: http://localhost:8083
