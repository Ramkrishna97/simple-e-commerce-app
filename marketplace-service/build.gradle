plugins { id 'org.springframework.boot' }

sourceSets {
    main {
        java {
            srcDirs = [
                'src/main/java',
                '../auth-service/src/main/java',
                '../user-service/src/main/java',
                '../product-service/src/main/java',
                '../cart-service/src/main/java',
                '../order-service/src/main/java',
                '../notification-service/src/main/java'
            ]
            exclude '**/*ServiceApplication.java'
            exclude '**/SecurityConfig.java'
            exclude '**/JwtAuthenticationFilter.java'
            exclude '**/EmbeddedKafkaConfig.java'
            exclude '**/NotificationEvents.java'
            exclude '**/NotificationController.java'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.h2database:h2'
}
