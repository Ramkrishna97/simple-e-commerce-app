server:
  port: 8080
  tomcat:
    threads:
      max: 16
      min-spare: 1
spring:
  application:
    name: marketplace-service
  datasource:
    url: jdbc:h2:file:./data/marketplacedb
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  h2:
    console:
      enabled: false
  jmx:
    enabled: false
app:
  jwt-secret: ${JWT_SECRET:change-this-demo-secret-to-a-long-random-value-at-least-32-bytes}
  temporary-password-length: 10
  internal-api-key: ${INTERNAL_API_KEY:local-order-service-key-change-in-production}
  cart-service-url: http://127.0.0.1:8080
  product-service-url: http://127.0.0.1:8080
